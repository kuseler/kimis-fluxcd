apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: coredns
data:
  Corefile: |
    .:53 {
        bind 0.0.0.0 ::
        errors
        log
        reload

        # 1. Match your specific Traefik domains FIRST
        rewrite stop name regex (.*\.)?homelab\.fritz\.box\. traefik-ingress.home. answer auto
        rewrite stop name regex (.*\.)?homelab\.home\. traefik-ingress.home. answer auto
        
        # 2. Dynamically translate ANY OTHER .home domain to .fritz.box
        rewrite stop name regex (.*)\.home\. {1}.fritz.box. answer auto
        
        # 3. Resolve them to your Traefik IP (for the homelab rewrites above)
        hosts {
            192.168.1.80 traefik-ingress.home.
            fallthrough
        }

        # 4. Forward unknown queries
        # Route Fritz!Box domains STRICTLY to your router to avoid NXDOMAIN leaks
        forward fritz.box 192.168.1.1
        
        # Route all other queries to upstream DNS (Router + Google)
        forward . 192.168.1.1 8.8.8.8 2001:4860:4860::8888 {
            max_concurrent 1000
        }
    }

