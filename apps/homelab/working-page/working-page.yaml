apiVersion: v1
kind: ConfigMap
metadata:
  name: working-page-html
  namespace: working-page
data:
  index.html: |
    <!DOCTYPE html>
    <html>
      <head>
        <title>Status</title>
        <style>
          body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f2f5; }
          h1 { color: #333; }
        </style>
      </head>
      <body>
        <h1>i am working</h1>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: working-page
  namespace: working-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: working-page
  template:
    metadata:
      labels:
        app: working-page
    spec:
      containers:
        - name: web
          image: nginx:stable-alpine3.24
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: html-volume
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: html-volume
          configMap:
            name: working-page-html
---
apiVersion: v1
kind: Service
metadata:
  name: working-page-svc
  namespace: working-page
spec:
  selector:
    app: working-page
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: working-page-ingress
  namespace: working-page
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Working Page"
    gethomepage.dev/description: "Cluster Health & Status"
    gethomepage.dev/group: "System"
    gethomepage.dev/icon: "si-nginx"
spec:
  ingressClassName: traefik
  rules:
    - host: homelab.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: working-page-svc
                port:
                  number: 80
    - host: homelab.fritz.box
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: working-page-svc
                port:
                  number: 80
    - host: working.homelab.fritz.box
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: working-page-svc
                port:
                  number: 80
    - host: working.homelab.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: working-page-svc
                port:
                  number: 80
