apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../_arr-base
patches:
  - target:
      kind: PersistentVolumeClaim
      name: arr-app-config-pvc
    patch: |-
      - op: replace
        path: /metadata/name
        value: sonarr-config-pvc
  - target:
      kind: Deployment
      name: arr-app
    patch: |-
      - op: replace
        path: /metadata/name
        value: sonarr
      - op: replace
        path: /metadata/labels/app
        value: sonarr
      - op: replace
        path: /spec/selector/matchLabels/app
        value: sonarr
      - op: replace
        path: /spec/template/metadata/labels/app
        value: sonarr
      - op: replace
        path: /spec/template/spec/containers/0/name
        value: sonarr
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: lscr.io/linuxserver/sonarr:4.0.20.3014-ls4
      - op: replace
        path: /spec/template/spec/volumes/0/persistentVolumeClaim/claimName
        value: sonarr-config-pvc
  - target:
      kind: Service
      name: arr-app
    patch: |-
      - op: replace
        path: /metadata/name
        value: sonarr
      - op: replace
        path: /metadata/labels/app
        value: sonarr
      - op: replace
        path: /spec/selector/app
        value: sonarr
  - target:
      kind: Ingress
      name: arr-app
    patch: |-
      - op: replace
        path: /metadata/name
        value: sonarr
      - op: add
        path: /metadata/annotations/gethomepage.dev~1name
        value: "Sonarr"
      - op: add
        path: /metadata/annotations/gethomepage.dev~1description
        value: "TV Series Management"
      - op: add
        path: /metadata/annotations/gethomepage.dev~1icon
        value: "sonarr.png"
      - op: replace
        path: /spec/rules/0/host
        value: sonarr.homelab.home
      - op: replace
        path: /spec/rules/0/http/paths/0/backend/service/name
        value: sonarr
      - op: replace
        path: /spec/rules/1/host
        value: sonarr.homelab.fritz.box
      - op: replace
        path: /spec/rules/1/http/paths/0/backend/service/name
        value: sonarr
