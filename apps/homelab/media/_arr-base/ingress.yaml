apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arr-app
  namespace: media
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Media"
spec:
  ingressClassName: traefik
  rules:
    - host: arr-app.homelab.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: arr-app
                port:
                  number: 8989
    - host: arr-app.homelab.fritz.box
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: arr-app
                port:
                  number: 8989
