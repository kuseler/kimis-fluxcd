apiVersion: apps/v1
kind: Deployment
metadata:
  name: arr-app
  namespace: media
  labels:
    app: arr-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: arr-app
  template:
    metadata:
      labels:
        app: arr-app
    spec:
      initContainers:
        - name: arr-init
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app']
          command:
            - sh
            - -c
            - |
              CFG=/config/config.xml
              HOSTS="${APP_NAME}.homelab.home,${APP_NAME}.homelab.fritz.box,${APP_NAME},${APP_NAME}.media.svc.cluster.local,localhost,127.0.0.1"
              if [ -f "$CFG" ]; then
                if grep -q "<AllowedHosts>" "$CFG"; then
                  sed -i "s|<AllowedHosts>.*</AllowedHosts>|<AllowedHosts>${HOSTS}</AllowedHosts>|" "$CFG"
                else
                  sed -i "s|</Config>|  <AllowedHosts>${HOSTS}</AllowedHosts>\n</Config>|" "$CFG"
                fi
                chown 1000:1000 "$CFG"
              fi
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: app
          image: lscr.io/linuxserver/arr-app:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Berlin
          ports:
            - name: http
              containerPort: 8989
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: arr-app-config-pvc
        - name: media
          persistentVolumeClaim:
            claimName: media-nfs-pvc
