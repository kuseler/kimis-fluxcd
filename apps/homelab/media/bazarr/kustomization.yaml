apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../_arr-base
patches:
  - target:
      kind: PersistentVolumeClaim
      name: arr-app-config-pvc
    patch: |-
      - op: replace
        path: /metadata/name
        value: bazarr-config-pvc
  - target:
      kind: Deployment
      name: arr-app
    patch: |-
      - op: replace
        path: /metadata/name
        value: bazarr
      - op: replace
        path: /metadata/labels/app
        value: bazarr
      - op: replace
        path: /spec/selector/matchLabels/app
        value: bazarr
      - op: replace
        path: /spec/template/metadata/labels/app
        value: bazarr
      - op: replace
        path: /spec/template/spec/containers/0/name
        value: bazarr
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: lscr.io/linuxserver/bazarr:v1.6.2-ls372
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 6767
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/volumes/0/persistentVolumeClaim/claimName
        value: bazarr-config-pvc
  - target:
      kind: Service
      name: arr-app
    patch: |-
      - op: replace
        path: /metadata/name
        value: bazarr
      - op: replace
        path: /metadata/labels/app
        value: bazarr
      - op: replace
        path: /spec/selector/app
        value: bazarr
      - op: replace
        path: /spec/ports/0/port
        value: 6767
      - op: replace
        path: /spec/ports/0/targetPort
        value: 6767
  - target:
      kind: Ingress
      name: arr-app
    patch: |-
      - op: replace
        path: /metadata/name
        value: bazarr
      - op: add
        path: /metadata/annotations/gethomepage.dev~1name
        value: "Bazarr"
      - op: add
        path: /metadata/annotations/gethomepage.dev~1description
        value: "Subtitles Management"
      - op: add
        path: /metadata/annotations/gethomepage.dev~1icon
        value: "bazarr.png"
      - op: replace
        path: /spec/rules/0/host
        value: bazarr.homelab.home
      - op: replace
        path: /spec/rules/0/http/paths/0/backend/service/name
        value: bazarr
      - op: replace
        path: /spec/rules/0/http/paths/0/backend/service/port/number
        value: 6767
      - op: replace
        path: /spec/rules/1/host
        value: bazarr.homelab.fritz.box
      - op: replace
        path: /spec/rules/1/http/paths/0/backend/service/name
        value: bazarr
      - op: replace
        path: /spec/rules/1/http/paths/0/backend/service/port/number
        value: 6767
