# ==============================================================================
# Authelia Secrets Template (Dummy Values)
# ==============================================================================
#
# IMPORTANT: DO NOT COMMIT REAL PLAINTEXT SECRETS TO GIT.
#
# OPTION 1: Manual Secret Creation (Recommended for Homelab)
# ------------------------------------------------------------------------------
# 1. Generate secrets on your machine:
#    JWT_SECRET=$(openssl rand -hex 32)
#    SESSION_KEY=$(openssl rand -hex 32)
#    STORAGE_KEY=$(openssl rand -hex 32)
#
# 2. Hash your user password with Argon2id:
#    docker run --rm authelia/authelia:latest authelia crypto hash generate argon2 --password "MySuperSecretPassword"
#
# 3. Create 'users_database.yml' locally and apply the secret directly to the cluster:
#    kubectl -n authelia create secret generic authelia-secrets \
#      --from-literal=identity_validation.reset_password.jwt.hmac.key="$JWT_SECRET" \
#      --from-literal=session.encryption.key="$SESSION_KEY" \
#      --from-literal=storage.encryption.key="$STORAGE_KEY" \
#      --from-file=users_database.yml=/path/to/users_database.yml
#
# OPTION 2: SOPS with Age (Flux CD Native Decryption)
# ------------------------------------------------------------------------------
# 1. Fill in real values in this file.
# 2. Encrypt with SOPS and Age public key:
#    sops --encrypt --age <YOUR_AGE_RECIPIENT> secrets.dummy.yaml > secrets.enc.yaml
# 3. Rename or add secrets.enc.yaml to kustomization.yaml and configure Flux sops provider:
#    spec:
#      decryption:
#        provider: sops
#        secretRef:
#          name: sops-age
#
# OPTION 3: Bitnami SealedSecrets
# ------------------------------------------------------------------------------
#    kubeseal --controller-name=sealed-secrets --format yaml < secrets.dummy.yaml > sealed-secrets.yaml
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: authelia-secrets
  namespace: authelia
type: Opaque
stringData:
  # Random 64-character hex strings:
  identity_validation.reset_password.jwt.hmac.key: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  session.encryption.key: "abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789"
  storage.encryption.key: "fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210"

  # User database with Argon2id hashed password
  users_database.yml: |
    ###############################################################
    #                 Authelia Users Database                     #
    ###############################################################
    users:
      kimi:
        disabled: false
        displayname: "Kimi Müller"
        # Password below is hashed for dummy password 'password123'
        # Generate your own hash:
        # docker run --rm authelia/authelia:latest authelia crypto hash generate argon2 --password "your-password"
        password: "$argon2id$v=19$m=65536,t=3,p=4$46b5k1V1YlQhO8T5Yk7Dzw$F6k5ZgHn1z4B5v9r+c0e2V4X6Y8Z1a3c5e7g9i1k3m"
        email: "kimi@kimimueller.de"
        groups:
          - admins
          - dev
