apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami-remote
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entryPoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    # Forward-Auth Middleware from authelia namespace (<namespace>-<middleware>@kubernetescrd)
    traefik.ingress.kubernetes.io/router.middlewares: authelia-authelia-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - whoami.kimimueller.de
  rules:
    - host: whoami.kimimueller.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whoami
                port:
                  number: 80
