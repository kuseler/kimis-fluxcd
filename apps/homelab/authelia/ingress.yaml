apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authelia
  namespace: authelia
  annotations:
    traefik.ingress.kubernetes.io/router.entryPoints: web,websecure
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Authelia"
    gethomepage.dev/description: "Single Sign-On & Forward Auth Portal"
    gethomepage.dev/group: "System"
    gethomepage.dev/icon: "authelia.png"
spec:
  ingressClassName: traefik
  rules:
    # Public Ingress via VPS Rathole tunnel
    - host: auth.kimimueller.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: authelia
                port:
                  number: 80
    # Internal LAN domains
    - host: auth.homelab.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: authelia
                port:
                  number: 80
    - host: auth.homelab.fritz.box
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: authelia
                port:
                  number: 80
