apiVersion: apps/v1
kind: Deployment
metadata:
  name: rathole-client
  namespace: rathole-client
  labels:
    app: rathole-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rathole-client
  template:
    metadata:
      labels:
        app: rathole-client
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: rathole-client
          image: rapiz1/rathole:v0.5.0
          imagePullPolicy: IfNotPresent
          command:
            - "/app/rathole"
            - "-c"
            - "/app/config/rathole.toml"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: RATHOLE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rathole-auth
                  key: token
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: "/app/config"
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: rathole-client-config
