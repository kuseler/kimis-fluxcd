# apps/rathole-client/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  # The secret is not included here as it will be created manually.
  - deployment.yaml

configMapGenerator:
  - name: rathole-client-config
    namespace: rathole-client
    files:
      - rathole.toml=rathole-client.toml
