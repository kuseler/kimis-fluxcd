apiVersion: apps/v1
kind: Deployment
metadata:
  name: rathole-server
  namespace: rathole
  labels:
    app: rathole-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rathole-server
  template:
    metadata:
      labels:
        app: rathole-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: rathole
          image: rapiz1/rathole:v0.5.0
          imagePullPolicy: IfNotPresent
          args:
            - /etc/rathole/rathole.toml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: control
              containerPort: 2333
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: fritzbox-wg
              containerPort: 51820
              protocol: UDP
          env:
            - name: RATHOLE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rathole-auth
                  key: token
          readinessProbe:
            tcpSocket:
              port: control
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: control
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/rathole
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: rathole-server-config
