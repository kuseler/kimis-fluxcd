# /clusters/vps/traefik-ingress.yaml
# Route plain HTTP traffic (entrypoint: web / port 80) to rathole's HTTP service.
# Priority 1 ensures specific HTTP routes like Hugo's Host(`kimimueller.de`) take precedence.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rathole-http
  namespace: rathole
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      priority: 1
      services:
        - name: rathole
          port: 80
---
# Route HTTPS / TLS traffic for Homelab subdomains to rathole with TLS passthrough
# so Homelab Traefik terminates TLS for homelab workloads.
# kimimueller.de is terminated directly on the VPS by Hugo's IngressRoute.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: rathole-https
  namespace: rathole
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`*.kimimueller.de`, `*.*.kimimueller.de`)
      services:
        - name: rathole
          port: 443
  tls:
    passthrough: true
