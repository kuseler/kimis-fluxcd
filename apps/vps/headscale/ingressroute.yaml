apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: headscale
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headscale-http
  namespace: headscale
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`headscale.kimimueller.de`)
      kind: Rule
      priority: 10
      middlewares:
        - name: https-redirect
      services:
        - name: headscale
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: headscale-https
  namespace: headscale
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`headscale.kimimueller.de`)
      kind: Rule
      services:
        - name: headscale
          port: 8080
  tls:
    certResolver: letsencrypt
